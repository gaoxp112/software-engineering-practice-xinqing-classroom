{% extends 'base.html' %}
{% block title %}账号设置 · 心晴课堂{% endblock %}
{% block content %}
<header class="page-header"><div><p class="eyebrow">账号</p><h1>账号设置</h1><p>更新密码后，后续登录将使用新密码。</p></div></header>
<section class="form-section narrow-section">
  <h2>修改密码</h2>
  <form method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>当前密码<input type="password" name="current_password" autocomplete="current-password" required></label>
    <label>新密码<input type="password" name="new_password" minlength="8" autocomplete="new-password" required><small>至少 8 位，并同时包含字母和数字</small></label>
    <button class="button button-primary" type="submit">更新密码</button>
  </form>
</section>
{% endblock %}
