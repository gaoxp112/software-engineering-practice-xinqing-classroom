{% extends 'base.html' %}
{% block title %}注册 · 心晴课堂{% endblock %}
{% block content %}
<section class="auth-visual compact" aria-label="课堂情绪示意">
  <a class="brand brand-light" href="{{ url_for('auth.login') }}"><span class="brand-mark">☀</span><span>心晴课堂</span></a>
  <div class="auth-copy"><p class="eyebrow">加入课堂</p><h1>记录真实感受</h1><p>你可以选择匿名提交，教师端不会显示你的姓名。</p></div>
  <div class="emoji-scene" aria-hidden="true"><span>🙂</span><span>😕</span><span>😄</span></div>
</section>
<section class="auth-panel">
  <div class="auth-form-wrap">
    <p class="eyebrow">创建账号</p><h2>注册</h2>
    <form method="post" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>姓名或昵称<input name="display_name" maxlength="30" required placeholder="课堂中显示的名称"></label>
      <label>用户名<input name="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" required placeholder="字母、数字或下划线"></label>
      <fieldset><legend>角色</legend><div class="segmented">
        <label><input type="radio" name="role" value="student" checked><span>学生</span></label>
        <label><input type="radio" name="role" value="teacher"><span>教师</span></label>
      </div></fieldset>
      <label>密码<span class="password-input"><input type="password" name="password" minlength="8" autocomplete="new-password" required placeholder="至少 8 位，包含字母和数字"><button class="password-toggle" type="button" aria-label="显示密码" aria-pressed="false" data-password-toggle>显示</button></span></label>
      <button class="button button-primary button-wide" type="submit">创建账号</button>
    </form>
    <p class="auth-switch">已有账号？<a href="{{ url_for('auth.login') }}">返回登录</a></p>
  </div>
</section>
{% endblock %}
